[metadata]
name = pyclacmd
version = 0.2.2
description = Drive Claude Code's interactive session programmatically from scripts and pipelines
long_description = file: README.md
long_description_content_type = text/markdown
author = Yuriy R
license = MIT
license_files = LICENSE
url = https://github.com/kurok/pyclacmd
keywords = claude, claude-code, claude-ai, anthropic, cli, automation, llm, ai, terminal, scripting
project_urls =
    Homepage = https://github.com/kurok/pyclacmd
    Source = https://github.com/kurok/pyclacmd
    Issues = https://github.com/kurok/pyclacmd/issues
    Changelog = https://github.com/kurok/pyclacmd/blob/main/CHANGELOG.md
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: MacOS
    Operating System :: POSIX
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Software Development :: Build Tools
    Topic :: Utilities
    Topic :: Terminals

[options]
packages = claudecmd
python_requires = >=3.8
include_package_data = True
install_requires =
    pexpect>=4.8
    pyte>=0.8

[options.entry_points]
console_scripts =
    claudecmd = claudecmd.cli:entrypoint

[options.extras_require]
dev =
    pytest>=7.0
