[metadata]
name = pyclacmd
version = 0.2.1
description = Programmatic, scriptable CLI wrapper around Claude Code
long_description = file: README.md
long_description_content_type = text/markdown
author = Yuriy R
license = MIT
license_files = LICENSE
url = https://github.com/kurok/pyclacmd
keywords = claude, claude-code, cli, automation, wrapper
classifiers =
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: MacOS
    Operating System :: POSIX
    Programming Language :: Python :: 3
    Topic :: Software Development :: Build Tools

[options]
packages = claudecmd
python_requires = >=3.8
include_package_data = True
install_requires =
    pexpect>=4.8
    pyte>=0.8

[options.entry_points]
console_scripts =
    claudecmd = claudecmd.cli:entrypoint

[options.extras_require]
dev =
    pytest>=7.0
